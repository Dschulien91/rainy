# Builds the Schach-Coach Android app. Inactive here: GitHub only runs workflows from .github/workflows/ at the repository root.
# pre-release "schach-coach-latest", so it can be downloaded straight to the phone.
name: Schach-Coach APK

on:
  push:
    paths:
      - 'chess-coach/**'
      - '.github/workflows/chess-coach-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: chess-coach/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp chess-coach/android/app/build/outputs/apk/release/app-release.apk schach-coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: schach-coach-apk
          path: schach-coach.apk

      - name: Publish as pre-release "schach-coach-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: schach-coach-latest
          name: Schach-Coach (neuester Build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Neuester Build von Schach-Coach (Commit ${{ github.sha }}, Branch ${{ github.ref_name }}).
            Auf dem Android-Handy `schach-coach.apk` herunterladen und öffnen (Installation aus unbekannten Quellen erlauben).
          files: schach-coach.apk
