# rainy production stack: app + radar server + self-hosted Open-Meteo behind Caddy (automatic HTTPS).
# Usage on the server (see deploy/README.md):  cp .env.example .env  &&  docker compose up -d
volumes:
  open-meteo-data:
  caddy-data:
  model-log:
  push-data:
  verify-log:
  eu-data:
  eun-data:
  na-data:

services:
  api:
    build: ../server
    restart: always
    environment:
      PORT: "8771"
      EDITION: ${EDITION:-de}   # de = first public version (Germany); full = Europe/USA radar + clouds (needs ~8 GB more RAM)
      OPENMETEO: "1"            # tells the app to use /om instead of the public Open-Meteo API
      OPENMETEO_URL: http://openmeteo:8080
      MODEL_LOG_DIR: /app/model_log
      VERIFY_LOG_DIR: /app/verify_log
      DATA_DIR: /app/data
      VAPID_SUBJECT: https://${DOMAIN}       # Web Push contact claim: the app's domain, no personal address
      # optional login (server/auth.py): Google sign-in and/or email link; unset values switch that method off
      PUBLIC_URL: https://${DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}   # Hetzner blocks outgoing 465 and 25; 587 = STARTTLS
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-rainy <hey@hellorainy.com>}
      # never set RAINY_DEV here: it enables fake test scenarios (server/devtools.py)
    volumes:
      - model-log:/app/model_log           # model snapshots for verify_blend.py
      - verify-log:/app/verify_log         # forecasts + DWD station truth for score.py / verify_alerts.py
      - push-data:/app/data                # push subscriptions, the VAPID key, users.db (must survive updates; back up)
    healthcheck:                           # unhealthy when the DWD data is older than 20 min (/api/ready)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8771/api/ready', timeout=10)"]
      interval: 2m
      timeout: 15s
      retries: 3

  # Europe test instance (beta, parallel to the Germany edition): EUMETNET OPERA radar + our own 2 h nowcast for all of
  # Europe, verified like the Germany edition (verify_log/eugrid_*.jsonl, score_same.py --log eugrid). Served under
  # /eu/ (Caddyfile). Memory-capped: it can never push the Germany edition out of memory.
  # Measured 10.11.: ~1.2 GB at rest, +1.0-1.3 GB for ~20 s during every S-PROG run (every 5 min). With the 2500m cap the
  # kernel killed it every ~10 min from the day sunny Europe and the advection blend were added (25 restarts in 5 h,
  # no Europe verification rows in that time). The server has 7.7 GB: Germany ~1.8, Open-Meteo ~0.7.
  api-eu:
    build: ../server
    restart: always
    mem_limit: 3400m
    environment:
      PORT: "8771"
      EDITION: eu
      EU_MODELS: icon_eu       # the model blend reads only the model on local disk
      OPENMETEO_URL: http://openmeteo:8080
      MODEL_LOG_DIR: /app/model_log
      VERIFY_LOG_DIR: /app/verify_log
      DATA_DIR: /app/data
      MALLOC_ARENA_MAX: "2"
    volumes:
      - verify-log:/app/verify_log         # eugrid_*.jsonl + obs_eu/ next to the Germany logs
      - eu-data:/app/data
    healthcheck:                           # unhealthy when the OPERA data is older than 20 min (/api/ready)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8771/api/ready', timeout=10)"]
      interval: 2m
      timeout: 15s
      retries: 3

  # Third instance (13.11.2026): our own Europe picture - OPERA with national radar products on top (server/national.py),
  # same nowcast and verification as api-eu, switchable in the app (settings, area Europe). Served under /eun/.
  # Its verification files go to verify_log/eun/ (same names as api-eu's, so the same scripts score both).
  # No sunny, no weather-model shadow, no tile pre-rendering, at most 1.5 cores: the two public instances come first.
  api-eun:
    build: ../server
    restart: always
    mem_limit: 2800m
    cpus: 1.5
    environment:
      PORT: "8771"
      EDITION: eu
      EU_NATIONAL: "1"
      EU_MODEL_BLEND: "0"
      SUNNY_DE: "0"
      PRERENDER: "0"
      VERIFY_LOG_DIR: /app/verify_log/eun
      DATA_DIR: /app/data
      MALLOC_ARENA_MAX: "2"
    volumes:
      - verify-log:/app/verify_log
      - eun-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8771/api/ready', timeout=10)"]
      interval: 2m
      timeout: 15s
      retries: 3

  # North America (beta): NOAA MRMS radar (US + southern Canada) with the same nowcast, tiles and verification as
  # api-eu (rainy_server.NorthAmericaMrms, region "eu" inside). Served under /na/, files in verify_log/na/.
  # Pre-renders its tiles (zoom 3-6 over North America); sunny from GOES-East; no weather-model blend.
  api-na:
    build: ../server
    restart: always
    mem_limit: 3000m   # + sunny for the Americas (GOES, ~0.5 GB more)
    cpus: 1.5
    environment:
      PORT: "8771"
      EDITION: eu
      NA: "1"
      EU_MODEL_BLEND: "0"
      SUNNY_DE: "1"      # sunny from GOES-East (sunny_na.py)
      VERIFY_LOG_DIR: /app/verify_log/na
      DATA_DIR: /app/data
      MALLOC_ARENA_MAX: "2"
    volumes:
      - verify-log:/app/verify_log
      - na-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8771/api/ready', timeout=10)"]
      interval: 2m
      timeout: 15s
      retries: 3

  openmeteo:
    image: ghcr.io/open-meteo/open-meteo
    restart: always
    volumes:
      - open-meteo-data:/app/data
    environment:
      REMOTE_DATA_DIRECTORY: https://openmeteo.s3.amazonaws.com/data/   # Open-Meteo's open-data mirror
      CACHE_SIZE: ${OPENMETEO_CACHE:-8GB}

  # Keeps the weather model files the app needs on local disk, so no request waits for a download (lazy remote reads
  # took 13-30 s for the first request per region). Models: DWD ICON-D2 (+15 min), ICON-EU, ICON global = Open-Meteo's
  # "best match" for Germany. Anything else is still read from the remote mirror on demand.
  openmeteo-sync:
    image: ghcr.io/open-meteo/open-meteo
    restart: always
    volumes:
      - open-meteo-data:/app/data
    command: >
      sync dwd_icon_d2,dwd_icon_d2_15min,dwd_icon_eu,dwd_icon
      temperature_2m,precipitation,cloud_cover,cloud_cover_low,weather_code,wind_u_component_700hPa,wind_v_component_700hPa
      --past-days 3 --repeat-interval 10 --concurrent 4

  # The same for North America (area "Nordamerika", 15.11.2026): without it the first weather-model request for a
  # North American place read the models from the remote mirror and took ~30 s. NOAA HRRR (3 km, +15 min steps) for
  # the US, Canada's GEM HRDPS (2.5 km), NOAA GFS 13 km as the wide fallback - all cut to North America.
  openmeteo-sync-na:
    image: ghcr.io/open-meteo/open-meteo
    restart: always
    volumes:
      - open-meteo-data:/app/data
    command: >
      sync ncep_hrrr_conus,ncep_hrrr_conus_15min,cmc_gem_hrdps,ncep_gfs013,ncep_gfs025
      temperature_2m,precipitation,cloud_cover,cloud_cover_low,weather_code,wind_u_component_700hPa,wind_v_component_700hPa,wind_speed_700hPa,wind_direction_700hPa,snowfall_water_equivalent,frozen_precipitation_percent,categorical_freezing_rain,cape,lifted_index,visibility,wind_gusts_10m,showers
      --past-days 2 --repeat-interval 15 --concurrent 4 --bounding-box 15,-170,75,-50
    # weather_code is derived by Open-Meteo for these models (snow, freezing rain, CAPE, lifted index, visibility,
    # gusts, showers): without those variables the symbol took 2.8 s per new place; the 700 hPa wind comes from GFS 0.25.

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../:/srv/app:ro           # the app itself (index.html, icons, manifest)
      - caddy-data:/data
    depends_on: [api, openmeteo]
