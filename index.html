<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>rainy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="rainy">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  :root {
    --bg: #ffffff;
    --fg: #14181f;
    --muted: #6b7380;
    --line: #e6e9ee;
    --rain: #2f7bf5;
    --sun: #f5a700;
    --sun-soft: #fbd98a;
    --temp: #e5484d;
    --night: #eef0f4;
    --logo: #0B2A5B;
    --night-band: #e6e9ef;
    --shadow: 0 -6px 24px rgba(20, 24, 31, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181e;
      --fg: #f1f3f6;
      --muted: #9aa2ae;
      --line: #2a2f38;
      --sun-soft: #7a5a14;
      --night: #1d2129;
      --logo: #8FB2FF;
      --night-band: #0b0d11;
      --shadow: 0 -6px 24px rgba(0, 0, 0, 0.5);
    }
  }
  /* map style chosen in the style card overrides the system setting */
  :root.theme-light {
    --bg: #ffffff;
    --fg: #14181f;
    --muted: #6b7380;
    --line: #e6e9ee;
    --sun-soft: #fbd98a;
    --night: #eef0f4;
    --logo: #0B2A5B;
    --night-band: #e6e9ef;
    --shadow: 0 -6px 24px rgba(20, 24, 31, 0.12);
  }
  :root.theme-dark {
    --bg: #15181e;
    --fg: #f1f3f6;
    --muted: #9aa2ae;
    --line: #2a2f38;
    --sun-soft: #7a5a14;
    --night: #1d2129;
    --logo: #8FB2FF;
    --night-band: #0b0d11;
    --shadow: 0 -6px 24px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  :root { --sheet-h: 268px; }
  body.hours-open { --sheet-h: 362px; }
  #map { position: absolute; inset: 0 0 var(--sheet-h) 0; }
  .leaflet-container { background: var(--night); }
  .grid-overlay { filter: blur(14px); }
  .radar-frame { transition: opacity 0.45s linear; filter: blur(2.5px); } /* linear cross-fade = smooth playback */
  .nodata-overlay { pointer-events: none; }
  .basemap { transition: filter 0.4s; }
  body.sunny .basemap { filter: sepia(0.55) saturate(1.6) hue-rotate(-12deg) brightness(1.08); } /* light orange cast */
  .eu-frame, .srvus-frame, .srvsat-frame { transition: opacity 0.45s linear; filter: blur(1px); } /* already interpolated by the server */
  .sat-frame { transition: opacity 0.4s ease; filter: blur(3px); }
  .rain-tiles { transition: opacity 0.35s linear; filter: blur(1px); }
  .cloud-tiles { transition: opacity 0.4s ease; } /* sharp cloud edges, drawn at screen resolution */
  /* dark map: lighten instead of covering, so sun tint reads as warm light and not olive */
  .place button { border: 0; background: var(--night); color: var(--fg); border-radius: 999px;
    font-size: 11px; padding: 1px 7px; margin-left: 6px; cursor: pointer; }

  .brand { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; z-index: 1000;
    background: var(--bg); padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 18px;
    letter-spacing: -0.02em; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .brand { display: flex; align-items: center; gap: 6px; }
  #brandName { color: var(--logo); }
  .brand .logo { width: 22px; height: 22px; color: var(--logo); }
  body.sunny .brand .logo, body.sunny #brandName { color: var(--sun); }
  .ico { width: 21px; height: 21px; vertical-align: middle; margin: -4px 5px -3px -2px; color: var(--logo); }
  .ico.sun { color: var(--sun); }
  body.sunny .brand span { color: var(--sun); }
  .version { font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 4px; }

  .fab { position: absolute; right: 12px; bottom: calc(var(--sheet-h) + 12px + var(--i, 0) * 54px); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 0;
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); color: var(--fg);
    box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 20px; cursor: pointer; }
  .toast { position: absolute; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 52px); z-index: 1100;
    transform: translate(-50%, -8px); width: max-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg);
    font-size: 13px; font-weight: 600; line-height: 1.35; padding: 10px 14px; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fab svg { width: 22px; height: 22px; display: block; }
  .panel { position: fixed; inset: 0; z-index: 2000; background: var(--bg); display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); }
  .panel[hidden] { display: none; }
  .panel-head { display: flex; align-items: center; gap: 10px; }
  .panel-head h2 { flex: 1; margin: 0; font-size: 22px; }
  .icon-btn { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--night); color: var(--fg);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .icon-btn svg { width: 20px; height: 20px; }
  .search-input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--night); color: var(--fg); }
  .results { list-style: none; margin: 10px 0 0; padding: 0; overflow: auto; }
  .results li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .results .r-go { flex: 1; text-align: left; border: 0; background: none; color: var(--fg); font: inherit; padding: 12px 4px; cursor: pointer; }
  .results .r-sub { display: block; font-size: 12px; color: var(--muted); }
  .results .hint { color: var(--muted); padding: 14px 4px; border: 0; }
  .star-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px; display: flex; }
  .star-btn.on { color: #f5b800; }
  .star-btn svg { width: 22px; height: 22px; }
  .star-btn.on path { fill: currentColor; }
  .place .star-btn { display: inline-flex; vertical-align: -4px; padding: 0 4px; background: none; color: var(--muted); margin-left: 4px; }
  .place .star-btn.on { color: #f5b800; }
  .place .star-btn svg { width: 16px; height: 16px; }
  .place .bell-btn { display: inline-flex; vertical-align: -4px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .place .bell-btn svg { width: 16px; height: 16px; }
  .place .bell-btn.on { color: var(--rain); }
  .place .bell-btn.on path { fill: currentColor; }
  /* rain alert settings card */
  .alert-card { position: absolute; left: 50%; bottom: calc(var(--sheet-h) + 12px); z-index: 1200; width: min(360px, calc(100% - 32px));
    transform: translate(-50%, 8px); background: var(--bg); color: var(--fg); border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .alert-card.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .alert-card h3 { margin: 0 0 4px; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert-card p { margin: 0 0 12px; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .alert-card .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .alert-card .seg { display: flex; gap: 4px; }
  .edition-de #modeSun, .edition-de #favSun { display: none; }
  .alert-card input[type=range] { width: 150px; accent-color: var(--rain); }
  .alert-card .row[hidden], .alert-card .hint[hidden] { display: none; }
  .bolt { filter: drop-shadow(0 0 2px rgba(0,0,0,.6)); }
  .alert-card .seg { flex-wrap: wrap; justify-content: flex-end; }
  .alert-card .sec { margin: 12px 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .alert-card .hint { margin: -4px 0 4px; font-size: 12px; color: var(--muted); }
  .alert-card .places button { border: 1px solid var(--line); background: none; color: var(--fg); font: inherit; font-size: 13px; padding: 4px 9px; border-radius: 999px; cursor: pointer; margin: 2px 0 2px 4px; }
  #styleCard { max-height: calc(100vh - var(--sheet-h) - 40px); overflow-y: auto; }
  .alert-card .lead-val { min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .alert-card .seg button { border: 1px solid var(--line); background: none; color: var(--fg); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .alert-card .seg button.on { background: var(--rain); border-color: var(--rain); color: #fff; }
  .alert-card input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--rain); }
  .alert-card .actions { display: flex; justify-content: space-between; margin-top: 12px; }
  .alert-card .actions button { border: 0; background: none; font: inherit; font-weight: 600; cursor: pointer; padding: 6px 2px; }
  .alert-card .off { color: var(--temp); }
  .alert-card .done { color: var(--rain); }
  .fav-controls { margin-top: 12px; }
  .fav-list { flex: 1; overflow: auto; margin: 12px -16px 0; padding: 0 16px; }
  .fav { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; background: var(--bg); overflow: hidden; }
  .fav.dragging { box-shadow: 0 8px 24px rgba(0,0,0,.3); position: relative; z-index: 2; }
  .fav-head { display: flex; align-items: center; gap: 6px; padding: 8px 6px 0 4px; }
  .fav-name { flex: 1; min-width: 0; text-align: left; border: 0; background: none; color: var(--fg); font: inherit;
    font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px; }
  .fav-name small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .drag { flex: none; border: 0; background: none; color: var(--muted); cursor: grab; padding: 6px 8px; touch-action: none; font-size: 18px; line-height: 1; }
  .fav-del { flex: none; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px; display: flex; }
  .fav-del svg { width: 16px; height: 16px; }
  .fav .hours { margin: 0; padding: 0 4px; border-top: 0; }
  .fav .loading { color: var(--muted); font-size: 13px; padding: 14px 10px; }
  .pin { background: none; border: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .place .tzhint { margin-left: 6px; font-size: 11px; color: var(--muted); }
  .place .pin-ico { width: 13px; height: 13px; vertical-align: -1px; margin-right: 3px; color: var(--muted); }
  .fab.spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet-h); z-index: 1000;
    background: var(--bg); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
    padding: 12px 16px max(10px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .place { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary { font-size: 17px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* never wraps: long texts end in … */
  .now-temp { font-size: 28px; font-weight: 300; margin-left: auto; white-space: nowrap; }

  .toggle { display: inline-flex; background: var(--night); border-radius: 999px; padding: 3px; flex: none; }
  .toggle button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700;
    font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .toggle button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.15); }

  .chart-row { display: flex; align-items: stretch; gap: 8px; flex: 1; min-height: 0; }
  .play { flex: none; width: 40px; border: 0; border-radius: 12px; background: var(--night); color: var(--fg);
    font-size: 16px; cursor: pointer; }
  .chart-wrap { position: relative; flex: 1; min-width: 0; touch-action: none; cursor: ew-resize; }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hours-tabs { flex: none; display: flex; gap: 6px; }
  .hours-tabs button { border: 0; background: var(--night); color: var(--muted); font: inherit; font-size: 12px;
    font-weight: 700; padding: 3px 12px; border-radius: 999px; cursor: pointer; }
  .hours-tabs button.on { background: var(--fg); color: var(--bg); }
  .hours-tabs .chev { display: inline-block; font-size: 10px; }
  .hours-tabs button.on .chev { transform: rotate(180deg); }
  .hours[hidden] { display: none; }
  .hours { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px;
    scrollbar-width: none; flex: none; border-top: 1px solid var(--line); }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: 0 0 calc((min(100vw, 600px) - 32px) / 6.5); scroll-snap-align: start; display: flex; flex-direction: column;
    align-items: center; gap: 2px; padding: 6px 0 2px; border: 0; background: none; font: inherit; font-size: 11px;
    color: var(--muted); cursor: pointer; }
  .hour { position: relative; }
  .hour.night { background: var(--night-band); }
  .hour .zz { position: absolute; bottom: 3px; left: 6px; font-size: 9px; font-weight: 700; font-style: italic; color: var(--muted); opacity: .8; }
  .hour .far { position: absolute; top: 6px; right: 6px; width: 3px; height: 3px; border-radius: 50%; background: var(--muted); opacity: .7; }
  .hour.night-start { border-radius: 12px 0 0 12px; }
  .hour.night-end { border-radius: 0 12px 12px 0; }
  .hour.night-start.night-end { border-radius: 12px; }
  .hour .tp { font-size: 13px; font-weight: 700; color: var(--fg); }
  .hour svg { width: 26px; height: 26px; }
  .hour .bar { width: 14px; height: 16px; display: flex; align-items: flex-end; background: var(--night); border-radius: 3px; overflow: hidden; }
  .hour .bar i { display: block; width: 100%; border-radius: 3px; }
  .status { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .status a { color: inherit; }
</style>
</head>

  if (g && g.bounds.contains(viewB) && Math.abs(g.zoom - map.getZoom()) < 2 && Date.now() - g.at < 30 * 60e3) return;
  const wait = 20e3 - (Date.now() - (loadGrid.lastTry || 0));

    navigator.geolocation.getCurrentPosition(
      (p) => { const loc = { lat: p.coords.latitude, lon: p.coords.longitude }; ownLocationSeen(loc); resolve(loc); },
      () => resolve(null), { timeout: 6000, maximumAge: 300000 });

    const a = (d.features && d.features[0] && d.features[0].properties) || {};

  const d = await getJSON(`${OM_BASE}/v1/forecast?latitude=${loc.lat.toFixed(2)}&longitude=${loc.lon.toFixed(2)}` +
    `&minutely_15=temperature_2m,precipitation,cloud_cover,is_day` +
    `&past_minutely_15=8&forecast_minutely_15=64` +
    `&hourly=temperature_2m,precipitation,cloud_cover,is_day,weather_code,wind_speed_700hPa,wind_direction_700hPa` +
    `&forecast_hours=73&daily=sunrise,sunset&forecast_days=4&timezone=auto&timeformat=unixtime`);

// ---------- Where data is missing ----------
// Rain mode: diagonal hatching where there is neither radar nor a satellite rain estimate.

map.createPane("nodata").style.zIndex = 345;

const CA_BOX = [[41.5, -141], [62, -52]];
async function updateNodata() {
  if (!map.getSize().x || !map.getSize().y) return; // map not laid out yet
  const token = ++nodataToken;
  const b = map.getBounds().pad(0.2), w = 320, h = Math.round(320 * map.getSize().y / map.getSize().x);
  const nw = L.CRS.EPSG3857.project(b.getNorthWest()), se = L.CRS.EPSG3857.project(b.getSouthEast());
  const [c, ctx] = canvasFor({ w, h }, null);

  ctx.fillStyle = dark ? "rgba(0,0,0,0.18)" : "rgba(120,120,120,0.10)";

    const mask = API_BASE ? await loadImage(`${API_BASE}/api/radar/mask?bbox=${nw.x},${se.y},${se.x},${nw.y}&width=${w}&height=${h}`).catch(() => null) : null;

// ---------- Map radar provider for the visible area ----------
// The timeline belongs to the chosen place, but the map shows radar for wherever the user looks: near the place

// ---------- Rendering ----------

  else if (k === "model") { hideTiles(); hideImg(); hideNowcast(); showGrid(f.ts, state.mode === "rain" ? "rain" : "cloud"); }
  else if (k === "nowcast") { hideTiles(); hideImg(); hideGrid(); showNowcast(f); }

}
function updateSource() {

  const k = shown ? shown.kind : "none", fc = f.ts > now;
  let text = k === "none" ? "Kein Radar für diesen Kartenausschnitt"
    : k === "radar" ? (fc ? "Radar-Vorhersage (DWD)" : "Radar gemessen (DWD)")
    : k === "eu" ? (fc ? "Radar-Vorhersage (rainy, aus EUMETNET OPERA)" : "Radar gemessen (EUMETNET OPERA)")

    : k === "ca" ? (fc ? "Radar-Vorhersage (Environment Canada)" : "Radar gemessen (Environment Canada)")
    : k === "us" ? "Radar gemessen (NOAA)"
    : k === "rtile" ? (RAIN_EU ? (shown.ref ? "Radar-Vorhersage (rainy, aus EUMETNET OPERA)" : "Radar gemessen (EUMETNET OPERA, NOAA)")
      : DE_ONLY ? (shown.ref ? "Radar-Vorhersage (DWD)" : "Radar gemessen (DWD)")
      : shown.ref ? "Radar-Vorhersage (DWD in Deutschland, sonst rainy)" : "Radar gemessen (DWD, EUMETNET OPERA, NOAA)")
    : k === "ctile" ? (shown.fc ? `Satellit hochgerechnet + Wettermodell (Bild von ${fmtTime(state.cloudRef)})` : `Satellit (EUMETSAT) · Stand ${fmtTime(f.map.ts)}`)
    : f.map.kind === "sat" ? `Satellit (${state.satRegion === "meteosat" ? "EUMETSAT" : "NOAA GOES / NASA"}) · Stand ${fmtTime(f.map.ts)}`
    : f.map.kind === "nowcast" ? `Satellit hochgerechnet${nowcast.motion ? " (Zug: " + nowcast.motion.source + ")" : ""}` +

    if (wet(fr[0])) {

    }

  }

  if (a.ownLoc && map.distance([r.lat, r.lon], [a.ownLoc.lat, a.ownLoc.lon]) < 1000) return;
  a.ownLoc = r;
  saveAlerts(a);
  if (a.own && ALERTS_POSSIBLE && "Notification" in window && Notification.permission === "granted") syncAlerts(a).catch((e) => console.warn("alerts", e));
}
const b64ToBytes = (b64) => Uint8Array.from(atob((b64 + "===".slice((b64.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const postJSON = (path, body) => fetch(`${API_BASE}${path}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

// Send the current places and settings to the server (or unsubscribe when no place is left).
async function syncAlerts(a) {
  const reg = await navigator.serviceWorker.register("sw.js");
  let sub = await reg.pushManager.getSubscription();
  if (!alertPlaces(a).length) {
    if (a.id) await postJSON("/api/push/unsubscribe", { id: a.id }).catch(() => {});
    if (sub) await sub.unsubscribe().catch(() => {});
    delete a.id;
    saveAlerts(a);
    return false;
  }
  if (!sub) {
    const { key } = await getJSON(`${API_BASE}/api/push/key`);
    if (!key) throw new Error("server has no push key");
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
  }
  const r = await postJSON("/api/push/subscribe", { id: a.id, subscription: sub.toJSON(), places: alertPlaces(a),
    lead: a.lead, early: a.early, quiet: a.quiet, thunder: a.thunder, tz: DEVICE_TZ, api: API_BASE });
  if (!r.ok) throw new Error(`subscribe ${r.status}`);
  const first = !a.id;
  a.id = (await r.json()).id;
  saveAlerts(a);
  return first;
}

async function bellClicked(loc, name) {
  if (!window.isSecureContext) return toast("Warnungen gehen nur über eine sichere Verbindung (https) – mit dem echten Server klappt das.");
  if (!("PushManager" in window) || !("Notification" in window)) {
    return toast(/iPhone|iPad/.test(navigator.userAgent)
      ? "Auf dem iPhone: erst über „Teilen → Zum Home-Bildschirm“ hinzufügen, dann dort die Glocke antippen."
      : "Dieser Browser kann keine Benachrichtigungen empfangen.");
  }
  if (!state.picked) return loadAlerts().own ? showSettings() : enableOwnAlert(loc);
  if (hasAlert(loc)) return showAlertCard(loc, name);
  if ((await Notification.requestPermission()) !== "granted") return toast("Benachrichtigungen sind für rainy blockiert – bitte in den Browser-Einstellungen erlauben.");
  const a = loadAlerts();
  a.places.push({ name: name || "", lat: +loc.lat.toFixed(4), lon: +loc.lon.toFixed(4) });
  if (!isFav(loc)) toggleFav(loc, name); // alerts are for home and favorites
  try {
    const first = await syncAlerts(a);
    if (first) postJSON("/api/push/test", { id: a.id }).catch(() => {});
  } catch (e) {
    console.warn("alerts", e);
    a.places = a.places.filter((p) => !sameLoc(p, loc));
    saveAlerts(a);
    renderPlace();
    return toast("Regenwarnung konnte nicht eingerichtet werden. Bitte später noch einmal versuchen.");
  }
  renderPlace();
  showAlertCard(loc, name);
}

// Lead time slider, heavy-rain heads-up and quiet hours: shared by the place card and the settings.
const alertControls = (a) => `<div class="row"><span>Vorwarnzeit</span><span><input type="range" min="${LEAD_MIN}" max="${LEAD_MAX}" step="5" value="${a.lead}" data-lead>
      <span class="lead-val">${a.lead} Min.</span></span></div>
    <p class="hint lead-hint"${a.lead > 45 ? "" : " hidden"}>Mehr als 45 Min. vorher werden Warnungen spürbar unsicherer.</p>
    <label class="row early-row"${a.lead >= 45 ? " hidden" : ""}><span>Bei Starkregen schon ca. 1 Std. vorher</span><input type="checkbox" data-k="early"${a.early ? " checked" : ""}></label>
    <label class="row"><span>Gewitterwarnung (DWD)</span><input type="checkbox" data-k="thunder"${a.thunder ? " checked" : ""}></label>
    <label class="row"><span>Nachtruhe 22–7 Uhr</span><input type="checkbox" data-k="quiet"${a.quiet ? " checked" : ""}></label>`;
function bindAlertControls(card, a, update) {
  const lead = card.querySelector("[data-lead]");
  if (!lead) return;
  lead.addEventListener("input", () => {
    card.querySelector(".lead-val").textContent = `${lead.value} Min.`;
    card.querySelector(".early-row").hidden = +lead.value >= 45; // the 1 h heads-up only adds something to short warning times
    card.querySelector(".lead-hint").hidden = +lead.value <= 45; // backtest: hit rate drops clearly beyond ~45 min
  });
  lead.addEventListener("change", () => { a.lead = +lead.value; update(); });
  card.querySelectorAll("input[data-k]").forEach((c) => c.addEventListener("change", () => { a[c.dataset.k] = c.checked; update(); }));
}
// Switch on the alert for "Mein Standort".
async function enableOwnAlert(loc) {
  if (!window.isSecureContext) return toast("Warnungen gehen nur über eine sichere Verbindung (https) – mit dem echten Server klappt das.");
  if (!("PushManager" in window) || !("Notification" in window)) return toast("Dieser Browser kann keine Benachrichtigungen empfangen.");
  if ((await Notification.requestPermission()) !== "granted") return toast("Benachrichtigungen sind für rainy blockiert – bitte in den Browser-Einstellungen erlauben.");
  const a = loadAlerts();
  a.own = true;
  if (loc) a.ownLoc = { lat: +loc.lat.toFixed(2), lon: +loc.lon.toFixed(2) };
  try {
    const first = await syncAlerts(a);
    if (first) postJSON("/api/push/test", { id: a.id }).catch(() => {});
    toast(`Regenwarnung für deinen Standort ist an – ${a.lead} Min. vorher.`);
  } catch (e) {
    console.warn("alerts", e);
    a.own = false;
    saveAlerts(a);
    toast("Regenwarnung konnte nicht eingerichtet werden. Bitte später noch einmal versuchen.");
  }
  renderPlace();
}

// Small card: lead time, heads-up for heavy rain, quiet hours, switch off.
function showAlertCard(loc, name) {
  const card = document.getElementById("alertCard"), a = loadAlerts();
  card.innerHTML = `<h3>Regenwarnung · ${esc(name || "dieser Ort")}</h3>
    <p>Wir melden uns, bevor hier Regen beginnt – nur beim ersten Schauer, danach erst wieder nach 2 trockenen Stunden.</p>
    ${alertControls(a)}
    <div class="actions"><button class="off">Für diesen Ort aus</button><button class="done">Fertig</button></div>`;
  const update = () => { saveAlerts(a); syncAlerts(a).catch((e) => console.warn("alerts", e)); };
  bindAlertControls(card, a, update);
  card.querySelector(".off").addEventListener("click", () => {
    a.places = a.places.filter((p) => !sameLoc(p, loc));
    update();
    card.classList.remove("show");
    renderPlace();
    toast(`Regenwarnung für ${name || "diesen Ort"} ist aus.`);
  });
  card.querySelector(".done").addEventListener("click", () => card.classList.remove("show"));
  card.classList.add("show");
}
map.on("click", () => document.getElementById("alertCard").classList.remove("show"));

// ---------- Settings ----------
// Rain alert for the own position (plus its settings and further places) and the map look. Map changes re-initialise
// the map colours, so the page reloads with the new choice; alert changes apply at once.
function showSettings() {
  const card = document.getElementById("styleCard"), a = loadAlerts();
  const seg = (key, opts) => `<span class="seg">${opts.map(([v, label]) =>
    `<button data-${key}="${v}" class="${MAP_STYLE[key] === v ? "on" : ""}">${label}</button>`).join("")}</span>`;
  card.innerHTML = `<h3>Einstellungen</h3>
    ${ALERTS_POSSIBLE ? `<div class="sec">Regenwarnung</div>
    <label class="row"><span>Für meinen Standort</span><input type="checkbox" data-own${a.own ? " checked" : ""}></label>
    <p class="hint">Gilt für den Ort, an dem du rainy zuletzt geöffnet hast.</p>
    ${alertControls(a)}
    ${a.places.length ? `<div class="row places"><span>Weitere Orte</span><span>${a.places.map((p, i) =>
      `<button data-rm="${i}" title="Warnung aus">${esc(p.name || "Ort")} ×</button>`).join("")}</span></div>` : ""}` : ""}
    <div class="sec">Karte</div>
    <div class="row"><span>Design</span>${seg("design", Object.entries(MAP_DESIGNS).map(([k, d]) => [k, d.label]))}</div>
    <div class="row"><span>Farben</span>${seg("theme", [["auto", "Auto"], ["light", "Hell"], ["dark", "Dunkel"]])}</div>
    ${DE_ONLY ? "" : `<div class="row"><span>Wolken</span>${seg("sat", [["clouds", "Standard"], ["photo", "Satellitenfoto"]])}</div>
    <div class="row"><span>Regen</span>${seg("rain", [["mix", "DWD + Europa"], ["eu", "Nur Europa"]])}</div>`}
    <div class="actions"><span></span><button class="done">Fertig</button></div>`;
  const update = () => { saveAlerts(a); syncAlerts(a).catch((e) => console.warn("alerts", e)); };
  bindAlertControls(card, a, update);
  const own = card.querySelector("[data-own]");
  if (own) own.addEventListener("change", async () => {
    if (own.checked) { await enableOwnAlert(state.picked ? null : state.loc); Object.assign(a, loadAlerts()); own.checked = a.own; }
    else { a.own = false; update(); renderPlace(); }
  });
  card.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => {
    a.places.splice(+b.dataset.rm, 1);
    update(); renderPlace(); showSettings();
  }));
  card.querySelectorAll("[data-sat], [data-theme], [data-rain], [data-design]").forEach((b) => b.addEventListener("click", () => {
    const key = ["sat", "theme", "rain", "design"].find((k) => b.dataset[k] != null), next = { ...MAP_STYLE, [key]: b.dataset[key] };
    if (next[key] === MAP_STYLE[key]) return;
    try { localStorage.setItem("rainy.style", JSON.stringify(next)); } catch {}
    location.reload();
  }));
  card.querySelector(".done").addEventListener("click", () => card.classList.remove("show"));
  document.getElementById("alertCard").classList.remove("show");
  card.classList.add("show");
}
document.getElementById("styleBtn").addEventListener("click", () => {
  const card = document.getElementById("styleCard");
  if (card.classList.contains("show")) card.classList.remove("show"); else showSettings();
});
map.on("click", () => document.getElementById("styleCard").classList.remove("show"));

// Jump the map to a place and show its forecast.
function goTo(loc, name) {
  map.setView([loc.lat, loc.lon], Math.max(map.getZoom(), 11));
  pickedMarker.setLatLng([loc.lat, loc.lon]).addTo(map);
  setLocation({ lat: loc.lat, lon: loc.lon }, true, name);
}

// Favorites panel: all favorites stacked, each with its own strip; strips scroll together for comparison.
let favRange = "24h", favData = null, favDataKey = "";
try { favRange = localStorage.getItem("rainy.favRange") || "24h"; } catch {}
async function loadFavData(favs) {
  await serverReady; // decides between our Open-Meteo and the public one
  const key = favs.map((f) => `${f.lat},${f.lon}`).join(";");
  if (favData && favDataKey === key && Date.now() - favData.at < 10 * 60e3) return favData.list;
  const d = await getJSON(`${OM_BASE}/v1/forecast?latitude=${favs.map((f) => f.lat)}&longitude=${favs.map((f) => f.lon)}` +
    `&hourly=temperature_2m,precipitation,cloud_cover,is_day,weather_code&forecast_hours=73&timezone=auto&timeformat=unixtime`);
  const list = (Array.isArray(d) ? d : [d]).map((x) => Object.assign(x.hourly.time.map((t, i) => ({
    ts: t * 1000, temp: x.hourly.temperature_2m[i], precip: x.hourly.precipitation[i], cover: x.hourly.cloud_cover[i],
    isDay: x.hourly.is_day[i], code: x.hourly.weather_code[i],
  })), { tz: x.timezone }));
  favData = { at: Date.now(), list }; favDataKey = key;
  return list;
}
async function renderFavs() {
  const favs = loadFavs(), el = document.getElementById("favList");
  const rain = state.mode === "rain", three = favRange === "3d";
  document.getElementById("favRain").classList.toggle("on", rain);
  document.getElementById("favSun").classList.toggle("on", !rain);
  document.getElementById("fav24").classList.toggle("on", !three);
  document.getElementById("fav3d").classList.toggle("on", three);
  if (!favs.length) {
    el.innerHTML = '<p class="loading">Noch keine Favoriten. Tippe auf den Stern neben dem Ortsnamen oder suche einen Ort mit der Lupe.</p>';
    return;
  }
  const card = (f, i, hours) => `<div class="fav" data-i="${i}"><div class="fav-head">` +
    `<button class="drag" aria-label="Verschieben">≡</button>` +
    `<button class="fav-name">${esc(f.name)}${hours ? `<small>${Math.round(hours[0].temp)}°</small>` : ""}</button>` +
    `<button class="fav-del" aria-label="Entfernen">${CLOSE}</button></div>` +
    (hours ? `<div class="hours">${stripHTML(hours, three, rain, hours.tz)}</div>` : '<div class="loading">lädt …</div>') + "</div>";
  el.innerHTML = favs.map((f, i) => card(f, i, favData && favDataKey === favs.map((x) => `${x.lat},${x.lon}`).join(";") ? favData.list[i] : null)).join("");
  try {
    const list = await loadFavData(favs);
    if (document.getElementById("favPanel").hidden) return;
    el.innerHTML = favs.map((f, i) => card(f, i, list[i])).join("");
  } catch { el.querySelectorAll(".loading").forEach((x) => (x.textContent = "Daten konnten nicht geladen werden")); }
}
function openFavs() { document.getElementById("favPanel").hidden = false; renderFavs(); }
function closeFavs() { document.getElementById("favPanel").hidden = true; }
document.getElementById("favs").addEventListener("click", openFavs);
document.getElementById("favClose").addEventListener("click", closeFavs);
document.getElementById("favRain").addEventListener("click", () => { state.mode = "rain"; applyView(); renderFavs(); });
document.getElementById("favSun").addEventListener("click", () => { state.mode = "sun"; applyView(); renderFavs(); });
for (const [id, r] of [["fav24", "24h"], ["fav3d", "3d"]]) {
  document.getElementById(id).addEventListener("click", () => {
    favRange = r;
    try { localStorage.setItem("rainy.favRange", r); } catch {}
    renderFavs();
  });
}
const favList = document.getElementById("favList");
favList.addEventListener("click", (e) => {
  const cardEl = e.target.closest(".fav");
  if (!cardEl) return;
  const favs = loadFavs(), f = favs[+cardEl.dataset.i];
  if (e.target.closest(".fav-name")) { closeFavs(); goTo(f, f.name); }
  else if (e.target.closest(".fav-del")) { favs.splice(+cardEl.dataset.i, 1); saveFavs(favs); renderFavs(); renderPlace(); }
});
// Scroll all strips together so the same hours line up.
let syncing = false;
favList.addEventListener("scroll", (e) => {
  if (syncing || !e.target.classList || !e.target.classList.contains("hours")) return;
  syncing = true;
  favList.querySelectorAll(".hours").forEach((h) => { if (h !== e.target) h.scrollLeft = e.target.scrollLeft; });
  requestAnimationFrame(() => (syncing = false));
}, true);
// Drag & drop reordering via the ≡ handle (works with touch and mouse).
favList.addEventListener("pointerdown", (e) => {
  const handle = e.target.closest(".drag");
  if (!handle) return;
  e.preventDefault();
  const cardEl = handle.closest(".fav");
  cardEl.classList.add("dragging");
  // The card moves to the slot under the finger while dragging.
  const move = (ev) => {
    const others = [...favList.querySelectorAll(".fav")].filter((c) => c !== cardEl);
    const before = others.find((o) => { const r = o.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
    if (before) { if (cardEl.nextElementSibling !== before) favList.insertBefore(cardEl, before); }
    else if (favList.lastElementChild !== cardEl) favList.appendChild(cardEl);
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    cardEl.classList.remove("dragging");
    const favs = loadFavs(), order = [...favList.querySelectorAll(".fav")].map((c) => +c.dataset.i);
    saveFavs(order.map((i) => favs[i]));
    if (favData) favData.list = order.map((i) => favData.list[i]);
    favDataKey = loadFavs().map((x) => `${x.lat},${x.lon}`).join(";");
    renderFavs();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
});

// ---------- Search ----------
const searchInput = document.getElementById("searchInput"), results = document.getElementById("results");
let searchTimer = null, lastResults = [];
function openSearch() {
  document.getElementById("searchPanel").hidden = false;
  searchInput.value = ""; results.innerHTML = "";
  setTimeout(() => searchInput.focus(), 50);
}
function closeSearch() { document.getElementById("searchPanel").hidden = true; searchInput.blur(); }
function renderResults() {
  if (!lastResults.length) { results.innerHTML = searchInput.value.trim().length >= 2 ? '<li class="hint">Nichts gefunden</li>' : ""; return; }
  results.innerHTML = lastResults.map((r, i) => {
    const sub = [r.admin1, r.country].filter(Boolean).join(", ");
    return `<li data-i="${i}"><button class="r-go">${esc(r.name)}<span class="r-sub">${esc(sub)}</span></button>` +
      `<button class="star-btn${isFav({ lat: r.latitude, lon: r.longitude }) ? " on" : ""}" aria-label="Favorit">${STAR}</button></li>`;
  }).join("");
}
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { lastResults = []; renderResults(); return; }
  searchTimer = setTimeout(async () => {
    try {
      const d = await getJSON(`${GEO_SEARCH}?name=${encodeURIComponent(q)}&count=10&language=de&format=json`);
      if (searchInput.value.trim() !== q) return;
      lastResults = d.results || [];
    } catch { lastResults = []; }
    renderResults();
  }, 300);
});
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && lastResults[0]) results.querySelector(".r-go").click();
  if (e.key === "Escape") closeSearch();
});
results.addEventListener("click", (e) => {
  const li = e.target.closest("li[data-i]");
  if (!li) return;
  const r = lastResults[+li.dataset.i], loc = { lat: r.latitude, lon: r.longitude };
  if (e.target.closest(".star-btn")) { toggleFav(loc, r.name); renderResults(); return; }
  closeSearch();
  goTo(loc, r.name);
});
document.getElementById("search").addEventListener("click", openSearch);
document.getElementById("searchClose").addEventListener("click", closeSearch);

// Reload everything: point data, radar and satellite frames, model grid.
async function refreshAll() {
  const btn = document.getElementById("refresh");
  btn.classList.add("spin");
  clearImgFrames();
  loadThunderLayers();
  state.satLatest = null;
  nowcast.base = null; nowcast.motionFor = null;
  for (const v of Object.values(state.views)) v.idx = v.nowIdx;
  await setLocation(state.loc, state.picked, state.placeName);
  btn.classList.remove("spin");
}

try {
  const saved = localStorage.getItem("rainy.hours") ?? (localStorage.getItem("rainy.hoursOpen") === "1" ? "24h" : "");
  setHours(saved || null);
} catch { setHours(null); }

(async function init() {
  const params = new URLSearchParams(location.search);
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("rainy.last")); } catch {}
  if (params.has("lat")) cached = null;

  // Known place from last visit: show it immediately, then check whether the user has moved.
  const posP = params.has("lat") ? Promise.resolve({ lat: +params.get("lat"), lon: +params.get("lon") }) : getPosition();
  if (cached) {
    state.home = cached;
    youAreHere.setLatLng([cached.lat, cached.lon]);
    map.setView([cached.lat, cached.lon], cached.zoom, { animate: false });
    await setLocation(cached, false, cached.name);
  }
  let loc = await posP;
  if (!loc && !cached) loc = { lat: FALLBACK.lat, lon: FALLBACK.lon };
  if (loc && (!cached || map.distance([loc.lat, loc.lon], [cached.lat, cached.lon]) > 1000)) {
    state.home = loc;
    youAreHere.setLatLng([loc.lat, loc.lon]);
    const place = await Promise.race([reverseGeocode(loc), new Promise((r) => setTimeout(() => r(null), 1500))]);
    const zoom = place ? await Promise.race([cityZoom(place), new Promise((r) => setTimeout(() => r(11), 1500))]) : 11;
    map.setView([loc.lat, loc.lon], zoom, { animate: false });
    await setLocation(loc, false, place ? place.name : undefined);
  }
  setInterval(refreshAll, 5 * 60e3);
})();
</script>
