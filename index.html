<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rainy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="rainy">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #ffffff;
    --fg: #14181f;
    --muted: #6b7380;
    --line: #e6e9ee;
    --rain: #2f7bf5;
    --sun: #f5a700;
    --sun-soft: #fbd98a;
    --temp: #e5484d;
    --night: #eef0f4;
    --logo: #0B2A5B;
    --shadow: 0 -6px 24px rgba(20, 24, 31, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181e;
      --fg: #f1f3f6;
      --muted: #9aa2ae;
      --line: #2a2f38;
      --sun-soft: #7a5a14;
      --night: #1d2129;
      --logo: #8FB2FF;
      --shadow: 0 -6px 24px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  :root { --sheet-h: 268px; }
  body.hours-open { --sheet-h: 362px; }
  #map { position: absolute; inset: 0 0 var(--sheet-h) 0; }
  .leaflet-container { background: var(--night); }
  .grid-overlay { filter: blur(14px); }
  .radar-frame { transition: opacity 0.4s ease; filter: blur(2.5px); }
  .sat-frame { transition: opacity 0.4s ease; filter: blur(3px); }
  /* dark map: lighten instead of covering, so sun tint reads as warm light and not olive */
  body.dark .sat-frame, body.dark .grid-overlay { mix-blend-mode: screen; }
  .place button { border: 0; background: var(--night); color: var(--fg); border-radius: 999px;
    font-size: 11px; padding: 1px 7px; margin-left: 6px; cursor: pointer; }

  .brand { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; z-index: 1000;
    background: var(--bg); padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 18px;
    letter-spacing: -0.02em; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .brand { display: flex; align-items: center; gap: 6px; }
  #brandName { color: var(--logo); }
  .brand .logo { width: 22px; height: 22px; color: var(--logo); }
  body.sunny .brand .logo, body.sunny #brandName { color: var(--sun); }
  .ico { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; color: var(--logo); }
  .ico.sun { color: var(--sun); }
  body.sunny .brand span { color: var(--sun); }
  .version { font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 4px; }

  .fab { position: absolute; right: 12px; bottom: calc(var(--sheet-h) + 12px); z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); color: var(--fg);
    box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 20px; cursor: pointer; }
  .fab.spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet-h); z-index: 1000;
    background: var(--bg); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
    padding: 12px 16px max(10px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .place { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary { font-size: 17px; font-weight: 700; line-height: 1.2; }
  .now-temp { font-size: 28px; font-weight: 300; margin-left: auto; }

  .toggle { display: inline-flex; background: var(--night); border-radius: 999px; padding: 3px; flex: none; }
  .toggle button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700;
    font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .toggle button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.15); }

  .chart-row { display: flex; align-items: stretch; gap: 8px; flex: 1; min-height: 0; }
  .play { flex: none; width: 40px; border: 0; border-radius: 12px; background: var(--night); color: var(--fg);
    font-size: 16px; cursor: pointer; }
  .chart-wrap { position: relative; flex: 1; min-width: 0; touch-action: none; cursor: ew-resize; }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hours-toggle { flex: none; align-self: center; border: 0; background: var(--night); color: var(--muted); font: inherit;
    font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; cursor: pointer; display: flex; gap: 6px; }
  body.hours-open .hours-toggle .chev { transform: rotate(180deg); }
  .hours[hidden] { display: none; }
  .hours { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px;
    scrollbar-width: none; flex: none; border-top: 1px solid var(--line); }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: 0 0 calc((min(100vw, 600px) - 32px) / 6.5); scroll-snap-align: start; display: flex; flex-direction: column;
    align-items: center; gap: 2px; padding: 6px 0 2px; border: 0; background: none; font: inherit; font-size: 11px;
    color: var(--muted); cursor: pointer; }
  .hour .tp { font-size: 13px; font-weight: 700; color: var(--fg); }
  .hour svg { width: 26px; height: 26px; }
  .hour .bar { width: 14px; height: 16px; display: flex; align-items: flex-end; background: var(--night); border-radius: 3px; overflow: hidden; }
  .hour .bar i { display: block; width: 100%; border-radius: 3px; }
  .status { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .status a { color: inherit; }
</style>
</head>

// ---------- Model grid (clouds, rain beyond the radar) ----------
async function loadGrid() {
  if (gridFetching) return;
  const viewB = map.getBounds(), g = state.grid;
  if (g && g.bounds.contains(viewB) && Math.abs(g.zoom - map.getZoom()) < 2) return;
  gridFetching = true;
  const b = viewB.pad(0.3);
  const n = b.getNorth(), s = b.getSouth(), w = b.getWest(), e = b.getEast();
  const lats = [], lons = [];
  for (let i = 0; i < GRID; i++) for (let j = 0; j < GRID; j++) {
    lats.push((n - (i + 0.5) * (n - s) / GRID).toFixed(3));
    lons.push((w + (j + 0.5) * (e - w) / GRID).toFixed(3));
  }
  try {
    const d = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}` +
      `&hourly=cloud_cover,precipitation,is_day&past_hours=2&forecast_hours=17&timeformat=unixtime`);
    const arr = Array.isArray(d) ? d : [d];
    state.grid = {
      bounds: b, zoom: map.getZoom(),
      t: arr[0].hourly.time.map((x) => x * 1000),
      cover: arr.map((p) => p.hourly.cloud_cover),
      precip: arr.map((p) => p.hourly.precipitation),
      isDay: arr.map((p) => p.hourly.is_day),
    };
    nowcast.cache.clear();
    renderFrame();
  } catch (err) { console.warn("grid failed", err); }

}
const gridCanvas = document.createElement("canvas");
gridCanvas.width = gridCanvas.height = GRID;
function showGrid(ts, kind, opacity = 1) {
  const g = state.grid;
  if (!g) { loadGrid(); return; }
  const ctx = gridCanvas.getContext("2d");
  const img = ctx.createImageData(GRID, GRID);
  for (let k = 0; k < g.cover.length; k++) {
    let c;
    if (kind === "rain") {
      const col = rainColor(interp(g.t, g.precip[k], ts));
      c = col ? [col[0], col[1], col[2], col[3]] : [0, 0, 0, 0];
    } else {
      const cover = clamp(interp(g.t, g.cover[k], ts) / 100, 0, 1);
      const day = interp(g.t, g.isDay[k], ts) >= 0.5;
      // Cloud layer composited over the sun tint (mixing the colors directly turns muddy brown).
      const ac = 0.8 * cover ** 1.3, as = day ? 0.22 * (1 - cover) : 0;
      const a = ac + as * (1 - ac);
      const comp = (k) => (a ? (CLOUD_RGB[k] * ac + SUN_RGB[k] * as * (1 - ac)) / a : 0);
      c = [comp(0), comp(1), comp(2), a];

    img.data.set([c[0], c[1], c[2], c[3] * 255], k * 4);

  ctx.putImageData(img, 0, 0);
  const url = gridCanvas.toDataURL();
  if (!gridOverlay || !gridOverlay.getBounds().equals(g.bounds)) {
    if (gridOverlay) gridOverlay.remove();
    gridOverlay = L.imageOverlay(url, g.bounds, { pane: "weather", className: "grid-overlay" }).addTo(map);
  } else gridOverlay.setUrl(url);
  gridOverlay.setOpacity(opacity);
}
function hideGrid() { if (gridOverlay) gridOverlay.setOpacity(0); }

// ---------- Location ----------
function getPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolve(null), { timeout: 6000, maximumAge: 300000 });
  });
}
async function reverseGeocode(loc, detail = false) {
  try {
    const d = await getJSON(`https://nominatim.openstreetmap.org/reverse?lat=${loc.lat}&lon=${loc.lon}` +
      `&zoom=${detail ? 14 : 10}&format=jsonv2&accept-language=de`);
    const a = d.address || {};
    const city = a.city || a.town || a.village || a.municipality;
    const part = detail && (a.suburb || a.city_district || a.quarter || a.neighbourhood);
    const name = part && city && part !== city ? `${part}, ${city}` : city || part || d.name || "Unbekannter Ort";
    return { name, bbox: d.boundingbox };
  } catch { return { name: "Ausgewählter Ort", bbox: null }; }
}
// Zoom so roughly the whole city is visible, but never wider than zoom 10 or closer than 13.
function cityZoom(bbox) {
  if (!bbox) return 11;
  const b = L.latLngBounds([+bbox[0], +bbox[2]], [+bbox[1], +bbox[3]]);
  return clamp(map.getBoundsZoom(b), 10, 13);
}

// ---------- Data ----------
async function loadPoint(loc) {
  const d = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}` +
    `&minutely_15=temperature_2m,precipitation,cloud_cover,is_day` +
    `&past_minutely_15=8&forecast_minutely_15=64` +
    `&hourly=temperature_2m,precipitation,cloud_cover,is_day,weather_code,wind_speed_700hPa,wind_direction_700hPa` +
    `&forecast_hours=25&timeformat=unixtime`);
  const m = d.minutely_15;
  // Steering wind at ~3 km height: fallback for how clouds move when the satellite gives no usable motion.
  const h = d.hourly;
  state.wind = h ? { kmh: h.wind_speed_700hPa[0], from: h.wind_direction_700hPa[0] } : null;
  state.hours = h ? h.time.map((t, i) => ({
    ts: t * 1000, temp: h.temperature_2m[i], precip: h.precipitation[i], cover: h.cloud_cover[i],
    isDay: h.is_day[i], code: h.weather_code[i],
  })) : [];
  state.point = {
    t: m.time.map((s) => s * 1000), temp: m.temperature_2m, precip: m.precipitation,
    cover: m.cloud_cover, isDay: m.is_day,
  };
}
async function loadRadarPoint(loc) {
  const now = Date.now(), iso = (t) => new Date(t).toISOString().slice(0, 19) + "Z";
  try {
    const d = await getJSON(`https://api.brightsky.dev/radar?lat=${loc.lat}&lon=${loc.lon}&distance=1000&format=plain` +
      `&date=${iso(now - 3600e3)}&last_date=${iso(now + 2.5 * 3600e3)}`);
    state.radarPoint = (d.radar || []).map((r) => {
      const g = r.precipitation_5;
      const center = g[Math.floor(g.length / 2)][Math.floor(g[0].length / 2)];
      return { ts: Date.parse(r.timestamp), mmh: (center / 100) * 12 }; // 0.01 mm per 5 min -> mm/h
    });
  } catch { state.radarPoint = []; } // outside Germany: no radar
}
// Newest available satellite cloud mask (the satellite runs ~20-30 min behind real time).
async function loadSatLatest() {
  try {
    const r = await fetch(`https://view.eumetsat.int/geoserver/msg_fes/clm/ows?service=WMS&version=1.3.0&request=GetCapabilities`);
    const m = (await r.text()).match(/<Dimension name="time"[^>]*>[^<]*\/([0-9T:.\-]+Z)\/PT15M/);
    state.satLatest = m ? Date.parse(m[1]) : null;
  } catch { state.satLatest = null; }
}
function isDayAt(ts) {
  const p = state.point;
  return p ? interp(p.t, p.isDay, ts) >= 0.5 : true;
}

// Build all four timelines (rain/sun x 2 h/14 h) from the loaded series.
function buildViews() {
  const now = Date.now(), p = state.point, R = state.radarPoint;
  const start = Math.floor(now / STEP) * STEP - 4 * STEP; // 1 h history
  const temp = (ts) => interp(p.t, p.temp, ts);
  const modelRain = (ts) => Math.max(0, interp(p.t, p.precip, ts) * 4); // mm per 15 min -> mm/h
  const radarEnd = R.length ? R[R.length - 1].ts : -Infinity;
  const steps = (hours) => Array.from({ length: 4 + hours * 4 + 1 }, (_, i) => start + i * STEP);
  const finish = (frames) => {
    const nowIdx = Math.max(0, frames.findLastIndex((f) => f.ts <= now));
    const split = frames.findIndex((f, i) => i > 0 && f.map.kind !== frames[i - 1].map.kind);
    return { frames, nowIdx, idx: nowIdx, split };
  };
  const old = { ...state.views };

  // rain, 2 h: 5-minute radar frames (or the model outside radar coverage)
  state.views["rain-short"] = finish(R.length
    ? R.map((r) => ({ ts: r.ts, value: r.mmh, temp: temp(r.ts), map: { kind: "radar", ts: r.ts } }))
    : steps(2).map((ts) => ({ ts, value: modelRain(ts), temp: temp(ts), map: { kind: "model" } })));

  // rain, 14 h: 15-minute steps; radar (averaged) while it lasts, then the model
  state.views["rain-long"] = finish(steps(14).map((ts) => {
    if (ts <= radarEnd) {
      const inStep = R.filter((r) => r.ts >= ts && r.ts < ts + STEP);
      const v = inStep.length ? inStep.reduce((a, r) => a + r.mmh, 0) / inStep.length : 0;
      return { ts, value: v, temp: temp(ts), map: { kind: "radar", ts: inStep.length ? inStep[0].ts : ts } };
    }
    return { ts, value: modelRain(ts), temp: temp(ts), map: { kind: "model" } };
  }));

  // sun: satellite up to now, model forecast afterwards
  for (const range of ["short", "long"]) {
    state.views[`sun-${range}`] = finish(steps(RANGE_HOURS[range]).map((ts) => {
      const isDay = isDayAt(ts) ? 1 : 0;
      // Sun share = clear-sky share from the same cloud cover the map shows (the model's separate
      // sunshine-duration field often contradicts its own cloud cover).
      const sun = isDay ? clamp(1 - interp(p.t, p.cover, ts) / 100, 0, 1) : 0;
      const S = state.satLatest;
      let map = { kind: "model" };
      if (S && ts <= S) map = { kind: "sat", ts };
      else if (S && ts - S < NOWCAST_MS) {
        const dt = ts - S;
        map = { kind: "nowcast", ts: S, dt, w: clamp(1 - (dt - 3600e3) / (NOWCAST_MS - 3600e3), 0, 1) };
      }
      return { ts, value: sun, model: sun, isDay, temp: temp(ts), map };
    }));
  }

  for (const key in state.views) if (old[key] && old[key] !== state.views[key]) {
    const o = old[key], v = state.views[key];
    if (o.idx !== o.nowIdx) v.idx = clamp(v.frames.findIndex((f) => f.ts >= o.frames[o.idx].ts), 0, v.frames.length - 1);
  }

}

// ---------- Rendering ----------
function renderFrame() {
  const s = cur(), f = s.frames[s.idx];
  if (!f) return;
  const k = f.map.kind;
  if (k === "model") { hideImg(); hideNowcast(); showGrid(f.ts, state.mode === "rain" ? "rain" : "cloud"); }
  else if (k === "nowcast") { hideImg(); showNowcast(f); showGrid(f.ts, "cloud", 1 - f.map.w); }
  else { hideGrid(); hideNowcast(); showImg(k, f.map.ts); }

}
function updateSource() {
  const s = cur(), f = s.frames[s.idx];
  if (!f) return;
  const now = Date.now();
  let text = f.map.kind === "radar" ? (f.ts > now ? "Radar-Vorhersage (DWD)" : "Radar gemessen (DWD)")
    : f.map.kind === "sat" ? `Satellit (EUMETSAT) · Stand ${fmtTime(f.map.ts)}`
    : f.map.kind === "nowcast" ? `Satellit hochgerechnet${nowcast.motion ? " (Zug: " + nowcast.motion.source + ")" : ""}` +
      (f.map.w < 0.5 ? " + Modell" : "")
    : state.mode === "rain" ? "Modellvorhersage, ungenauer" : "Wolken-Vorhersage (Modell)";
  const img = s.frames.filter((x) => x.map.kind === "radar" || x.map.kind === "sat");
  const keys = [...new Set(img.map((x) => `${x.map.kind}:${x.map.ts}`))];
  const ready = keys.filter((k) => imgFrames.has(k) && frameReady(imgFrames.get(k))).length;
  if (ready < keys.length) text += ` · lade ${ready}/${keys.length}`;
  document.getElementById("source").textContent = text;
  clearTimeout(updateSource.timer);
  if (ready < keys.length) updateSource.timer = setTimeout(updateSource, 500);
}

function summary() {
  const s = cur(), fr = s.frames.slice(s.nowIdx), h = RANGE_HOURS[state.range];
  if (!fr.length) return "Keine Daten";
  if (state.mode === "rain") {
    const wet = (f) => f.value >= 0.1;
    if (wet(fr[0])) {
      const dry = fr.find((f) => !wet(f));
      return dry ? `Regen bis ca. ${fmtTime(dry.ts)}` : `Regen hält die nächsten ${h} h an`;
    }
    const next = fr.find(wet);
    return next ? `Regen ab ca. ${fmtTime(next.ts)}` : `Die nächsten ${h} Stunden trocken`;
  }
  const sunny = (f) => f.value >= 0.5;
  if (sunny(fr[0])) {
    const end = fr.find((f) => !sunny(f));
    return end ? `Sonne bis ca. ${fmtTime(end.ts)}` : "Sonnig für die nächsten Stunden";
  }
  const next = fr.find(sunny);
  if (next) return `Sonne ab ca. ${fmtTime(next.ts)}`;
  const some = fr.find((f) => f.value >= 0.2);
  if (some) return `Kaum Sonne, etwas ab ca. ${fmtTime(some.ts)}`;
  return fr[0].isDay ? `Keine Sonne in den nächsten ${h} h` : `Nacht – keine Sonne in den nächsten ${h} h`;
}

const chart = document.getElementById("chart");
function drawChart() {
  const s = cur(), frames = s.frames;
  const dpr = window.devicePixelRatio || 1;
  const W = chart.clientWidth, H = chart.clientHeight;
  if (!W || !H || !frames.length) return;
  chart.width = W * dpr; chart.height = H * dpr;
  const ctx = chart.getContext("2d");
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const col = (n) => css.getPropertyValue(n).trim();
  const axisH = 16, top = 20, plotH = H - axisH - top;
  const n = frames.length, bw = W / n;
  const x = (i) => i * bw + bw / 2;
  const rain = state.mode === "rain";

  // Night shading (sunny mode)
  if (!rain) {
    ctx.fillStyle = col("--night");
    frames.forEach((f, i) => { if (!f.isDay) ctx.fillRect(i * bw, top, bw + 0.5, plotH); });
  }
  // Rain intensity guides: light 0.5, moderate 2, heavy 8 mm/h (evenly spaced on the sqrt scale)
  const guideLabels = [];
  if (rain) {
    ctx.lineWidth = 1;
    for (const [mmh, label] of [[0.5, "leicht"], [2, "mittel"], [8, "stark"]]) {
      const gy = Math.round(top + plotH - Math.sqrt(mmh / 8) * plotH) + 0.5;
      ctx.strokeStyle = col("--line"); ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
      ctx.setLineDash([]);
      guideLabels.push([label, gy]);
    }
  }
  // Bars: rain intensity (sqrt scale, capped at 8 mm/h) or sunshine share
  frames.forEach((f, i) => {
    const v = rain ? Math.sqrt(clamp(f.value, 0, 8) / 8) : f.value;
    if (!(v > 0.005)) return;
    const h = Math.max(2, v * plotH);
    const past = i < s.nowIdx;
    ctx.fillStyle = rain ? rgba(rainColor(Math.max(f.value, 0.1)), past ? 0.5 : 1) : col(past ? "--sun-soft" : "--sun");
    ctx.beginPath();
    ctx.roundRect(i * bw + bw * 0.12, top + plotH - h, bw * 0.76, h, Math.min(3, bw * 0.3));
    ctx.fill();
  });
  ctx.fillStyle = col("--line");
  ctx.fillRect(0, top + plotH, W, 1);

  // Where the data source changes (radar -> model, satellite -> forecast)
  if (s.split > 0) {
    const sx = s.split * bw;
    ctx.strokeStyle = col("--muted"); ctx.lineWidth = 1; ctx.setLineDash([1, 3]);
    ctx.beginPath(); ctx.moveTo(sx, top); ctx.lineTo(sx, top + plotH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = col("--muted"); ctx.font = "10px system-ui, sans-serif"; ctx.textAlign = "left";
    if (sx < W - 50) ctx.fillText(rain ? "Modell ›" : "Prognose ›", sx + 3, top + plotH - 4);
  }

  // Temperature line in the upper part of the plot
  const temps = frames.map((f) => f.temp).filter((t) => t != null);
  if (temps.length) {
    let tMin = Math.min(...temps), tMax = Math.max(...temps);
    if (tMax - tMin < 4) { const m = (tMin + tMax) / 2; tMin = m - 2; tMax = m + 2; }
    const ty = (t) => top + 4 + (1 - (t - tMin) / (tMax - tMin)) * plotH * 0.55;
    ctx.strokeStyle = col("--temp"); ctx.lineWidth = 2; ctx.lineJoin = "round";
    ctx.beginPath();
    frames.forEach((f, i) => { if (f.temp != null) i ? ctx.lineTo(x(i), ty(f.temp)) : ctx.moveTo(x(i), ty(f.temp)); });
    ctx.stroke();
    ctx.font = "600 11px system-ui, sans-serif"; ctx.fillStyle = col("--temp"); ctx.textAlign = "center";
    const iMax = frames.reduce((a, f, i) => (f.temp > frames[a].temp ? i : a), 0);
    const iMin = frames.reduce((a, f, i) => (f.temp < frames[a].temp ? i : a), 0);
    for (const i of new Set([iMax, iMin])) {
      const lx = clamp(x(i), rain ? 48 : 14, W - 14); // keep clear of the guide labels
      ctx.fillText(Math.round(frames[i].temp) + "°", lx, i === iMax ? ty(frames[i].temp) - 5 : ty(frames[i].temp) + 13);
    }
  }

  // Guide labels on top, with a backdrop for legibility
  ctx.font = "10px system-ui, sans-serif"; ctx.textAlign = "left";
  for (const [label, gy] of guideLabels) {
    ctx.fillStyle = col("--bg");
    ctx.fillRect(0, gy - 11, ctx.measureText(label).width + 6, 11);
    ctx.fillStyle = col("--muted");
    ctx.fillText(label, 3, gy - 2);
  }

  // Time axis
  ctx.fillStyle = col("--muted"); ctx.font = "11px system-ui, sans-serif"; ctx.textAlign = "center";
  const labelEvery = state.range === "short" ? 30 : 180; // minutes
  frames.forEach((f, i) => {
    const d = new Date(f.ts);
    if ((d.getHours() * 60 + d.getMinutes()) % labelEvery === 0) {
      ctx.fillText(fmtTime(f.ts), clamp(x(i), 16, W - 16), H - 3);
      ctx.fillRect(x(i), top + plotH, 1, 3);
    }
  });

  // "now" marker
  ctx.strokeStyle = col("--muted"); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(x(s.nowIdx), top); ctx.lineTo(x(s.nowIdx), top + plotH); ctx.stroke();
  ctx.setLineDash([]);

  // Selected frame cursor with a time bubble
  const cx = x(s.idx);
  ctx.strokeStyle = col("--fg"); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, top + plotH); ctx.stroke();
  const label = s.idx === s.nowIdx ? "jetzt" : fmtTime(frames[s.idx].ts);
  ctx.font = "700 11px system-ui, sans-serif";
  const bwid = ctx.measureText(label).width + 12, bx = clamp(cx - bwid / 2, 0, W - bwid);
  ctx.fillStyle = col("--fg");
  ctx.beginPath(); ctx.roundRect(bx, 2, bwid, 16, 8); ctx.fill();
  ctx.fillStyle = col("--bg"); ctx.textAlign = "center";
  ctx.fillText(label, bx + bwid / 2, 14);
  if (s.idx !== s.nowIdx) { // small "jetzt" tick so the present stays findable
    ctx.fillStyle = col("--muted"); ctx.font = "10px system-ui, sans-serif";
    const nx = x(s.nowIdx);
    if (Math.abs(nx - cx) > 34) ctx.fillText("jetzt", clamp(nx, 14, W - 14), 14);
  }
}

// ---------- Hourly strip ----------
// Small outline weather icons (24 px grid) in the same style as the logo.
// Small outline weather icons (24 px grid) in the same style as the logo, with gradations:
// cloudiness in five steps, 1-3 drops / flakes by intensity, thunderstorm, sleet, fog.
const sunG = (t = "") => `<g transform="${t}" stroke="#F5A700" stroke-width="2" stroke-linecap="round" fill="none">` +
  '<circle cx="12" cy="12" r="4.2"/>' + [0, 45, 90, 135, 180, 225, 270, 315].map((a) => {
    const r = (a * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
    return `<line x1="${(12 + 7 * c).toFixed(2)}" y1="${(12 + 7 * s).toFixed(2)}" x2="${(12 + 9.3 * c).toFixed(2)}" y2="${(12 + 9.3 * s).toFixed(2)}"/>`;
  }).join("") + "</g>";
const moonG = (t = "") => `<path transform="${t}" d="M16 4.5a7.5 7.5 0 1 0 3.8 12.6A6.2 6.2 0 0 1 16 4.5z" fill="none" ` +
  'stroke="var(--muted)" stroke-width="2" stroke-linejoin="round"/>';
const cloudG = (t = "", stroke = "var(--fg)") => `<path transform="${t}" d="M7.5 19h9.2a3.8 3.8 0 0 0 .4-7.6A5.3 5.3 0 0 0 7 12.4a3.4 3.4 0 0 0 .5 6.6z" ` +
  `fill="var(--bg)" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>`;
const spread = (n, gap = 3.6) => Array.from({ length: n }, (_, i) => 12 + (i - (n - 1) / 2) * gap);
const dropsG = (n) => spread(n).map((x) => `<line x1="${x}" y1="18.5" x2="${x - 1.2}" y2="22.5" stroke="var(--rain)" stroke-width="2" stroke-linecap="round"/>`).join("");
const flakesG = (n) => spread(n, 4).map((x, i) => `<circle cx="${x}" cy="${20.5 + (i % 2) * 1.5}" r="1.2" fill="var(--fg)"/>`).join("");
const boltG = '<path d="M12.8 16.5l-2.6 3.6h3l-2 3.4" fill="none" stroke="#F5A700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
const UP = "translate(0 -3)"; // cloud lifted to make room for precipitation below
function skyG(h, lifted) {
  const orb = (t) => (h.isDay ? sunG(t) : moonG(t)), c = h.cover, dy = lifted ? -3 : 0;
  if (c < 15 && !lifted) return orb("");
  if (c < 40) return orb(`translate(-2 ${-2 + dy}) scale(.85)`) + cloudG(`translate(8 ${8.5 + dy}) scale(.6)`);
  if (c < 70) return orb(`translate(-3.5 ${-4 + dy}) scale(.75)`) + cloudG(`translate(2 ${1.5 + dy}) scale(.85)`);
  if (c < 90) return orb(`translate(9 ${-1 + dy}) scale(.5)`) + cloudG(`translate(0 ${dy})`);
  return cloudG(`translate(3 ${-3 + dy}) scale(.8)`, "var(--muted)") + cloudG(`translate(0 ${dy})`);
}
function weatherIcon(h) {
  const c = h.code, mm = h.precip;
  let body;
  const snow = (c >= 71 && c <= 77) || c === 85 || c === 86;
  const sleet = c === 56 || c === 57 || c === 66 || c === 67;
  const rainy = mm >= 0.1 || (c >= 51 && c <= 67) || (c >= 80 && c <= 82);
  if (c >= 95) body = cloudG(UP) + boltG + (mm >= 0.1 ? dropsG(1).replace(/x1="12"/, 'x1="16.5"').replace(/x2="10.8"/, 'x2="15.3"') : "");
  else if (snow) body = skyG(h, true) + flakesG(c === 75 || c === 86 ? 3 : c === 73 ? 2 : 1);
  else if (sleet) body = skyG(h, true) + dropsG(1).replace(/x1="12"/, 'x1="10"').replace(/x2="10.8"/, 'x2="8.8"') + '<circle cx="15" cy="21" r="1.2" fill="var(--fg)"/>';
  else if (rainy) body = skyG(h, true) + dropsG(mm >= 4 || c === 65 || c === 82 ? 3 : mm >= 1 || c === 63 || c === 81 ? 2 : 1);
  else if (c === 45 || c === 48) body = '<g stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="6" y1="13" x2="18" y2="13"/><line x1="4" y1="17" x2="20" y2="17"/></g>';
  else body = skyG(h, false);
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
}
function renderHours() {
  const el = document.getElementById("hours"), list = state.hours || [];
  const rain = state.mode === "rain";
  el.innerHTML = list.slice(0, 24).map((h, i) => {
    const label = i === 0 ? "Jetzt" : new Date(h.ts).getHours() + " Uhr";
    let v, color;
    if (rain) { v = Math.sqrt(clamp(h.precip, 0, 8) / 8); color = h.precip >= 0.1 ? rgba(rainColor(h.precip)) : "transparent"; }
    else { v = h.isDay ? clamp(1 - h.cover / 100, 0, 1) : 0; color = "var(--sun)"; }
    const bar = v > 0.02 ? `<i style="height:${Math.max(3, v * 16).toFixed(1)}px;background:${color}"></i>` : "";
    return `<button class="hour" data-ts="${h.ts}"><span>${label}</span>${weatherIcon(h)}` +
      `<span class="tp">${Math.round(h.temp)}°</span><span class="bar">${bar}</span></button>`;
  }).join("");
}
// Expand / collapse the hourly strip; the choice is remembered on this device.
function setHoursOpen(open) {
  document.body.classList.toggle("hours-open", open);
  document.getElementById("hours").hidden = !open;
  document.getElementById("hoursToggle").setAttribute("aria-expanded", open);
  try { localStorage.setItem("rainy.hoursOpen", open ? "1" : "0"); } catch {}
  map.invalidateSize();
  drawChart();
}
document.getElementById("hoursToggle").addEventListener("click", () => setHoursOpen(!document.body.classList.contains("hours-open")));
try { setHoursOpen(localStorage.getItem("rainy.hoursOpen") === "1"); } catch { setHoursOpen(false); }

// Tap an hour: jump the timeline (and map) to it, switching to 14 h if needed.
document.getElementById("hours").addEventListener("click", (e) => {
  const btn = e.target.closest(".hour");
  if (!btn) return;
  const ts = +btn.dataset.ts;
  if (ts > cur().frames[cur().frames.length - 1].ts && state.range === "short") { state.range = "long"; applyView(); }
  const fr = cur().frames;
  if (ts > fr[fr.length - 1].ts) return;
  setIdx(Math.max(0, fr.findIndex((f) => f.ts >= ts)));
});

function updateHeader() {
  renderHours();
  document.getElementById("summary").textContent = summary();
  const p = state.point;
  const t = p && interp(p.t, p.temp, Date.now());
  document.getElementById("nowTemp").textContent = t != null ? Math.round(t) + "°" : "–°";
}

// ---------- Interaction ----------
function setIdx(i) {
  const s = cur();
  i = clamp(i, 0, s.frames.length - 1);
  if (i === s.idx) return;
  s.idx = i;
  renderFrame();
}
const wrap = document.getElementById("chartWrap");
function idxFromEvent(e) {
  const r = wrap.getBoundingClientRect();
  return Math.floor(((e.clientX - r.left) / r.width) * cur().frames.length);
}
wrap.addEventListener("pointerdown", (e) => { stop(); wrap.setPointerCapture(e.pointerId); setIdx(idxFromEvent(e)); });
wrap.addEventListener("pointermove", (e) => { if (wrap.hasPointerCapture(e.pointerId)) setIdx(idxFromEvent(e)); });

const playBtn = document.getElementById("play");
function stop() { clearInterval(state.playing); state.playing = null; playBtn.textContent = "▶"; }
function play() {
  const s = cur();
  if (s.idx >= s.frames.length - 1) setIdx(0);
  playBtn.textContent = "❚❚";
  let waited = 0;
  state.playing = setInterval(() => {
    const s = cur();
    if (s.idx >= s.frames.length - 1) { stop(); return; }
    // Hold the current frame (max ~2 s) until the next image has arrived, so playback never flickers.
    const m = s.frames[s.idx + 1].map;
    const next = (m.kind === "radar" || m.kind === "sat") && imgFrame(m.kind, m.ts);
    if (next && !frameReady(next) && waited++ < 4) { loadImgFrame(next); return; }
    waited = 0;
    setIdx(s.idx + 1);
  }, state.range === "short" && state.mode === "rain" ? 450 : 300);
}
playBtn.addEventListener("click", () => (state.playing ? stop() : play()));

function needsGrid() { return cur().frames.some((f) => f.map.kind === "model" || f.map.kind === "nowcast"); }
function needsNowcast() { return cur().frames.some((f) => f.map.kind === "nowcast"); }
function applyView() {
  stop();
  document.body.classList.toggle("sunny", state.mode === "sun");
  document.getElementById("brandName").textContent = state.mode === "sun" ? "sunny" : "rainy";
  document.querySelector("#brandLogo use").setAttribute("href", state.mode === "sun" ? "#sunIcon" : "#logo");
  document.getElementById("modeRain").classList.toggle("on", state.mode === "rain");
  document.getElementById("modeSun").classList.toggle("on", state.mode === "sun");
  document.getElementById("rangeShort").classList.toggle("on", state.range === "short");
  document.getElementById("rangeLong").classList.toggle("on", state.range === "long");
  if (needsGrid()) loadGrid();
  if (needsNowcast()) { loadNowcastBase(); loadMotion(); }
  updateHeader();
  renderFrame();
  preloadFrames();
}
document.getElementById("modeRain").addEventListener("click", () => { state.mode = "rain"; applyView(); });
document.getElementById("modeSun").addEventListener("click", () => { state.mode = "sun"; applyView(); });
document.getElementById("rangeShort").addEventListener("click", () => { state.range = "short"; applyView(); });
document.getElementById("rangeLong").addEventListener("click", () => { state.range = "long"; applyView(); });
document.getElementById("refresh").addEventListener("click", refreshAll);
document.getElementById("locate").addEventListener("click", async () => {
  const loc = (await getPosition()) || state.home;
  state.home = loc;
  youAreHere.setLatLng([loc.lat, loc.lon]);
  map.setView([loc.lat, loc.lon], map.getZoom() < 10 ? 11 : map.getZoom());
  await setLocation(loc, false);
});
// Long-press (touch) or right-click on the map: show the forecast for that spot.
let lastPick = 0;
map.on("contextmenu", (e) => {
  if (Date.now() - lastPick < 600) return; // Leaflet tap-hold and native contextmenu can both fire
  lastPick = Date.now();
  if (navigator.vibrate) navigator.vibrate(15);
  pickedMarker.setLatLng(e.latlng).addTo(map);
  setLocation({ lat: e.latlng.lat, lon: e.latlng.lng }, true);
});
// Panned or zoomed beyond the loaded area: fetch a new view for all image frames, and the grid if needed.
map.on("moveend", () => {
  if (needsGrid()) loadGrid();
  if (needsNowcast()) loadNowcastBase().then(() => renderFrame());
  if (imgView && (!imgView.bounds.contains(map.getBounds()) || Math.abs(imgView.zoom - map.getZoom()) >= 1)) {
    imgView = makeView();
    if (shownKey) loadImgFrame(imgFrames.get(shownKey));
    preloadFrames();
  }
});
window.addEventListener("resize", drawChart);

// ---------- Loading ----------
// Load timeline data for a location. picked = chosen by long-press (not the user's own position).
async function setLocation(loc, picked, knownName) {
  const req = ++locRequest;
  stop();
  state.loc = loc; state.picked = picked;
  if (!picked) pickedMarker.remove();
  const placeEl = document.getElementById("place");
  placeEl.textContent = picked ? "📍 Ort wird geladen …" : knownName || "…";
  const nameP = knownName ? Promise.resolve(knownName) : reverseGeocode(loc, picked).then((p) => p.name);
  try {
    const satP = state.satLatest && Date.now() - state.satLatest < 45 * 60e3 ? null : loadSatLatest();
    await Promise.all([loadPoint(loc), loadRadarPoint(loc), satP]);
  } catch (err) {
    document.getElementById("summary").textContent = "Wetterdaten konnten nicht geladen werden";
    console.error(err);
    return;
  }
  if (req !== locRequest) return; // a newer request won
  buildViews();
  const name = await nameP;
  if (req !== locRequest) return;
  state.placeName = name;
  placeEl.textContent = picked ? "📍 " + name : name;
  if (picked) {
    const back = document.createElement("button");
    back.textContent = "× zurück";
    back.addEventListener("click", () => document.getElementById("locate").click());
    placeEl.append(back);
  } else {
    try { localStorage.setItem("rainy.last", JSON.stringify({ lat: loc.lat, lon: loc.lon, name, zoom: map.getZoom() })); } catch {}
  }
  if (needsGrid()) loadGrid();
  if (state.mode === "sun") { loadNowcastBase(); loadMotion(); }
  updateHeader();
  renderFrame();
  preloadFrames();
}

// Reload everything: point data, radar and satellite frames, model grid.
async function refreshAll() {
  const btn = document.getElementById("refresh");
  btn.classList.add("spin");
  clearImgFrames();
  state.grid = null; state.satLatest = null;
  nowcast.base = null; nowcast.motionFor = null;
  for (const v of Object.values(state.views)) v.idx = v.nowIdx;
  await setLocation(state.loc, state.picked, state.placeName);
  btn.classList.remove("spin");
}

(async function init() {
  const params = new URLSearchParams(location.search);
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("rainy.last")); } catch {}
  if (params.has("lat")) cached = null;

  // Known place from last visit: show it immediately, then check whether the user has moved.
  const posP = params.has("lat") ? Promise.resolve({ lat: +params.get("lat"), lon: +params.get("lon") }) : getPosition();
  if (cached) {
    state.home = cached;
    youAreHere.setLatLng([cached.lat, cached.lon]);
    map.setView([cached.lat, cached.lon], cached.zoom, { animate: false });
    await setLocation(cached, false, cached.name);
  }
  let loc = await posP;
  if (!loc && !cached) loc = { lat: FALLBACK.lat, lon: FALLBACK.lon };
  if (loc && (!cached || map.distance([loc.lat, loc.lon], [cached.lat, cached.lon]) > 1000)) {
    state.home = loc;
    youAreHere.setLatLng([loc.lat, loc.lon]);
    const place = await Promise.race([reverseGeocode(loc), new Promise((r) => setTimeout(() => r(null), 1500))]);
    map.setView([loc.lat, loc.lon], place ? cityZoom(place.bbox) : 11, { animate: false });
    await setLocation(loc, false, place ? place.name : undefined);
  }
  setInterval(refreshAll, 5 * 60e3);
})();
</script>
</body>
